[project]
name = "afterimage"
version = "0.1.0"
description = "Personal wallpaper collection: gallery, review and discovery service"
requires-python = ">=3.11"
dependencies = [
  "pillow>=11.0",
  "pyyaml>=6.0",
]

# The web service lives in service/afterimage. Run it with: uv sync --group service
[dependency-groups]
service = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
]
dev = [
  "pytest>=8.3",
]
